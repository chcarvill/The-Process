<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Process</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f11;--surface:#16181c;--surface2:#1e2126;--border:#2a2d34;--border2:#353940;--text:#e8eaed;--text2:#8b909a;--hint:#555b66;--active:#2bce8c;--active-bg:#0d2e20;--warn:#f59e0b;--warn-bg:#2a1f08;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:var(--mono);cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:1.25rem 2rem;border-bottom:.5px solid var(--border)}
.top h1{font-family:var(--mono);font-size:18px;font-weight:500;letter-spacing:.06em}
.top .acts{display:flex;gap:8px}
.btn{font-size:11px;padding:6px 14px;border-radius:20px;border:.5px solid var(--border2);background:transparent;color:var(--text2)}
.btn:hover{color:var(--text);border-color:var(--hint)}
.btn.go{border-color:var(--active);color:var(--active)}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}
.side{border-right:.5px solid var(--border);padding:1rem;display:flex;flex-direction:column;gap:6px}
.ent{display:flex;align-items:center;gap:8px;text-align:left;font-family:var(--sans);font-size:13px;padding:8px 10px;border-radius:8px;border:.5px solid transparent;background:transparent;color:var(--text2)}
.ent:hover{background:var(--surface)}
.ent.on{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.main{padding:1.25rem 2rem 3rem;max-width:860px}
.name{width:100%;font-family:var(--sans);font-size:22px;font-weight:600;background:transparent;border:none;color:var(--text);outline:none;margin-bottom:12px}
.tabs{display:flex;gap:0;border-bottom:.5px solid var(--border);margin-bottom:1.25rem}
.tab{font-size:12px;padding:9px 18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);margin-bottom:-.5px}
.tab.on{color:var(--active);border-bottom-color:var(--active)}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:14px}
.card h2{font-size:15px;font-weight:600;margin-bottom:2px}
.card .sub{font-size:12px;color:var(--hint);margin-bottom:12px;max-width:62ch}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:10px}
textarea,input[type=text],select{display:block;width:100%;margin-top:4px;font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--text);background:var(--surface2);border:.5px solid var(--border2);border-radius:6px;padding:8px 10px;outline:none;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--active)}
button:focus-visible{outline:2px solid var(--active);outline-offset:2px}
.flag{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border:.5px solid var(--warn);border-radius:6px;padding:8px 12px;margin-bottom:10px}
.flag[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.chip{font-size:11px;padding:4px 10px;border-radius:20px;border:.5px solid var(--border2);background:transparent;color:var(--text2)}
.chip:hover{border-color:var(--active);color:var(--active)}
.tier{display:grid;grid-template-columns:1fr 120px 28px;gap:8px;align-items:start;margin-bottom:8px}
.tier textarea{grid-column:1/3}
.tier .x{background:none;border:none;color:var(--hint);font-size:14px;margin-top:8px}
.tier .x:hover{color:#ef4444}
.phase{border-top:.5px solid var(--border);padding-top:12px;margin-top:12px}
.phase:first-of-type{border-top:none;margin-top:0;padding-top:0}
.ph-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;font-weight:500}
.ph-head select{width:auto;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ro{font-size:13px;color:var(--text);background:var(--surface2);border-radius:6px;padding:8px 10px;white-space:pre-wrap;margin-bottom:6px}
.ro.empty{color:var(--warn)}
.link{font-size:12px;color:var(--active);margin-left:4px}
@media(max-width:700px){.wrap{grid-template-columns:1fr}.side{border-right:none;border-bottom:.5px solid var(--border);flex-direction:row;flex-wrap:wrap}.main,.top{padding-left:1rem;padding-right:1rem}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><h1>The Process</h1>
<div class="acts"><span id="msg" role="status" style="font-size:12px;color:var(--active);align-self:center"></span><button class="btn go" data-a="sendmc">Send to Mission Control</button><button class="btn" data-a="export">Export</button><button class="btn" data-a="import">Import</button><input type="file" id="file" accept=".json" hidden></div></div>
<div class="wrap"><nav class="side" id="side" aria-label="Endeavours"></nav><main class="main" id="main"></main></div>
<script>
const K='process_v1';
const PH=[['needs','Market needs analysis'],['invent','Invention'],['create','Creation'],['deploy','Deployment'],['market','Marketing']];
const ST=['Not started','In progress','Done'];
const CH=['A sample of the product','A free session or call','Useful content on the topic','A small free tool'];
const SECS=[
 ['Offering','What you sell, to whom, and why they would want it.',[['offering.what','What it is',3],['offering.who','Who it is for',2],['offering.problem','Problem it solves',3],['offering.delivery','How it is made or delivered',3]]],
 ['Business structure','The legal and operating shape of this endeavour.',[['structure.type','Structure (sole trader, company, trust and so on)',1],['structure.why','Why this structure',3]]],
 ['Legal and compliance','Registrations, insurance, licences, terms.',[['legal','Notes',3]]],
 ['Numbers','Costs, pricing logic and targets.',[['numbers','Notes',4]]],
 ['Files and links','Where the files and information for this endeavour live.',[['files','Locations and links',3]]],
 ['Decisions log','Date, decision, reason. Keep the reasoning so you can revisit it.',[['decisions','Log',4]]]
];
const Q=new URLSearchParams(location.search);
let D,sel=Q.get('e'),tab=Q.get('tab')==='funnel'?'funnel':'dossier';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const set=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x]=a[x]||{},o)[l]=v};
const mk=(name,o)=>Object.assign({id:uid(),name,offering:{},tiers:{free:'',paid:[]},structure:{},phases:{},funnel:{}},o||{});
function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!D||!Array.isArray(D.e)||!D.e.length)D={e:[mk('MindRoar',{offering:{what:'Structured 10-session behaviour-change coaching program, built on an externalizing, behaviour-first approach.',who:'Unfulfilled careerists and professionals.',delivery:'Ten coaching sessions.'}})]}}
const SK='process_summary_v1';
const sum=()=>({v:1,at:new Date().toISOString(),e:D.e.map(e=>({id:e.id,name:e.name||'',free:e.tiers.free||'',paid:e.tiers.paid.map(t=>({name:t.name||'',price:t.price||''})),overview:e.funnel.overview||'',aware:e.funnel.aware||'',lead:e.funnel.lead||'',offer:e.funnel.offer||'',sale:e.funnel.sale||'',channels:e.funnel.channels||'',c8:e.funnel.c8||''}))});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D));localStorage.setItem(SK,JSON.stringify(sum()))}catch(e){}};
const cur=()=>D.e.find(x=>x.id===sel)||(sel=(D.e.find(x=>x.name===Q.get('n'))||D.e[0]).id,D.e.find(x=>x.id===sel));
const noFree=E=>!(E.tiers.free||'').trim();
const ta=(E,p,l,r)=>`<label>${l}<textarea rows="${r||3}" data-p="${p}">${esc(get(E,p))}</textarea></label>`;
const inp=(E,p,l)=>`<label>${l}<input type="text" data-p="${p}" value="${esc(get(E,p))}"></label>`;
function side(){
 document.getElementById('side').innerHTML=D.e.map(e=>`<button class="ent${e.id===cur().id?' on':''}" data-a="sel" data-id="${e.id}">${noFree(e)?'<span class="dot" title="No free entry point yet"></span>':''}<span>${esc(e.name||'Untitled')}</span></button>`).join('')+'<button class="btn" data-a="add" style="margin-top:6px">+ Add endeavour</button>';
}
function tiers(E){
 const paid=E.tiers.paid.map((t,i)=>`<div class="tier"><input type="text" data-t="${i}.name" placeholder="Level name" value="${esc(t.name)}" aria-label="Level name"><input type="text" data-t="${i}.price" placeholder="Price" value="${esc(t.price)}" aria-label="Price"><button class="x" data-a="deltier" data-i="${i}" aria-label="Remove level">✕</button><textarea rows="2" data-t="${i}.inc" placeholder="What is included, and what moves someone up to it" aria-label="What is included">${esc(t.inc)}</textarea></div>`).join('');
 return `<section class="card"><h2>Tiers</h2><p class="sub">Every endeavour needs a low-risk first step that earns trust. Define it here, then the paid levels above it.</p>
 <div class="flag" id="flag"${noFree(E)?'':' hidden'}>No free entry point yet. What will you give away to earn trust?</div>
 ${ta(E,'tiers.free','Free entry point',3)}
 <div class="chips">${CH.map((c,i)=>`<button class="chip" data-a="chip" data-i="${i}">${c}</button>`).join('')}</div>
 <p style="font-size:12px;color:var(--text2);margin-bottom:8px">Paid levels</p>${paid||'<p class="sub">No paid levels yet.</p>'}
 <button class="btn" data-a="addtier">+ Add paid level</button></section>`;
}
function phases(E){
 return `<section class="card"><h2>Phases</h2><p class="sub">Where this endeavour is in its build, with the steps you repeat and the objectives that mean it is done.</p>`+PH.map(([k,l])=>{
  const s=Number(get(E,'phases.'+k+'.s'))||0;
  return `<div class="phase"><div class="ph-head"><span>${l}</span><select data-p="phases.${k}.s" aria-label="${l} status">${ST.map((t,i)=>`<option value="${i}"${s===i?' selected':''}>${t}</option>`).join('')}</select></div>
  <div class="two">${ta(E,'phases.'+k+'.steps','Recurring steps, in order',3)}${ta(E,'phases.'+k+'.objs','Objectives',3)}</div></div>`}).join('')+'</section>';
}
function dossier(E){
 return SECS.slice(0,1).map(sec).join('')+tiers(E)+SECS.slice(1).map(sec).join('')+phases(E);
 function sec([h,s,f]){return `<section class="card"><h2>${h}</h2><p class="sub">${s}</p>${f.map(([p,l,r])=>r===1?inp(E,p,l):ta(E,p,l,r)).join('')}</section>`}
}
function funnel(E){
 const paid=E.tiers.paid.filter(t=>t.name||t.price).map(t=>t.name+(t.price?' ('+t.price+')':'')).join('\n');
 const c8=(E.funnel.c8||'').trim();
 return `<section class="card"><h2>Top of the funnel</h2><p class="sub">Read from the Tiers section of the dossier, so a change there shows up here.</p>
 <div class="ro${noFree(E)?' empty':''}">${noFree(E)?'No free entry point yet. Add one in the dossier.':esc(E.tiers.free)}</div>
 ${paid?`<div class="ro">${esc(paid)}</div>`:''}</section>
 <section class="card"><h2>Funnel</h2><p class="sub">What a person goes through, from first noticing you to becoming a paying customer.</p>
 ${ta(E,'funnel.overview','Overview: the funnel in a sentence or two',2)}${ta(E,'funnel.aware','Awareness: where people first find you',2)}${ta(E,'funnel.lead','Lead: how they start the free thing or join your list',2)}${ta(E,'funnel.offer','Offer: how free moves to paid',2)}${ta(E,'funnel.sale','Sale and after: delivery, follow-up, referrals',2)}</section>
 <section class="card"><h2>Marketing campaign</h2><p class="sub">The channels, content and schedule, and what has actually worked.</p>
 ${ta(E,'funnel.channels','Channels and content',3)}${ta(E,'funnel.schedule','Schedule',2)}${ta(E,'funnel.results','Results and lessons',3)}
 <label>Communic8 campaign link<input type="text" data-p="funnel.c8" placeholder="https://" value="${esc(E.funnel.c8)}"></label>${/^https?:\/\//i.test(c8)?`<a class="link" href="${esc(c8)}" target="_blank" rel="noopener">Open campaign</a>`:''}</section>`;
}
function main(){
 const E=cur();
 document.getElementById('main').innerHTML=`<input class="name" data-p="name" value="${esc(E.name)}" aria-label="Endeavour name">
 <div class="tabs"><button class="tab${tab==='dossier'?' on':''}" data-a="tab" data-id="dossier">Dossier</button><button class="tab${tab==='funnel'?' on':''}" data-a="tab" data-id="funnel">Funnel and marketing</button><button class="btn go" data-a="email" style="margin:0 0 6px auto;align-self:center">Email view</button></div>`+(tab==='dossier'?dossier(E):funnel(E))+`<button class="btn" data-a="del" style="margin-top:8px">Delete this endeavour</button>`;
}
const render=()=>{side();main()};
const line=(l,v)=>{v=(v||'').trim();return v?l+':\n'+v+'\n\n':''};
const head=h=>h+'\n'+'-'.repeat(h.length)+'\n';
const secTxt=(E,[h,,f])=>{const b=f.map(([p,l])=>line(l,get(E,p))).join('');return b?head(h)+b:''};
function dossierTxt(E){
 const paid=E.tiers.paid.filter(t=>t.name||t.price||t.inc).map(t=>'- '+(t.name||'Untitled level')+(t.price?' ('+t.price+')':'')+(t.inc?'\n  '+t.inc.trim().replace(/\n/g,'\n  '):'')).join('\n');
 const tiersTxt=head('Tiers')+(noFree(E)?'No free entry point yet.\n\n':line('Free entry point',E.tiers.free))+(paid?'Paid levels:\n'+paid+'\n\n':'');
 const ph=PH.map(([k,l])=>{const s=Number(get(E,'phases.'+k+'.s'))||0,st=get(E,'phases.'+k+'.steps'),ob=get(E,'phases.'+k+'.objs');
  return (s||(st||'').trim()||(ob||'').trim())?l+' ('+ST[s]+')\n'+line('Recurring steps',st)+line('Objectives',ob):''}).join('');
 return secTxt(E,SECS[0])+tiersTxt+SECS.slice(1).map(s=>secTxt(E,s)).join('')+(ph?head('Phases')+ph:'');
}
function funnelTxt(E){
 const paid=E.tiers.paid.filter(t=>t.name||t.price).map(t=>t.name+(t.price?' ('+t.price+')':'')).join('\n');
 const F=p=>get(E,'funnel.'+p);
 return head('Top of the funnel')+(noFree(E)?'No free entry point yet.\n\n':line('Free entry point',E.tiers.free))+line('Paid levels',paid)
  +head('Funnel')+line('Overview',F('overview'))+line('Awareness',F('aware'))+line('Lead',F('lead'))+line('Offer',F('offer'))+line('Sale and after',F('sale'))
  +head('Marketing campaign')+line('Channels and content',F('channels'))+line('Schedule',F('schedule'))+line('Results and lessons',F('results'))+line('Communic8 campaign',F('c8'));
}
function emailView(){
 const E=cur(),page=tab==='dossier'?'Dossier':'Funnel and marketing',d=new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const txt=(E.name||'Untitled')+' - '+page+'\n'+d+'\n\n'+(tab==='dossier'?dossierTxt(E):funnelTxt(E))+'Generated by The Process.';
 const sub='The Process: '+(E.name||'Untitled')+' - '+page+' ('+new Date().toLocaleDateString('en-AU')+')';
 const u='mailto:?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(txt);
 if(u.length<1800){location.href=u;return}
 const go=()=>{location.href='mailto:?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent('Paste the copied text here.')};
 if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>{alert('This view is too long to fit in an email link, so it has been copied. Paste it into the email.');go()},()=>{location.href=u});
 else location.href=u;
}
function onInput(e){
 const t=e.target,E=cur();
 if(t.dataset.p){set(E,t.dataset.p,t.value);save();
  if(t.dataset.p==='tiers.free'){const f=document.getElementById('flag');if(f)f.hidden=!noFree(E);side()}
  if(t.dataset.p==='name')side()}
 else if(t.dataset.t){const[i,f]=t.dataset.t.split('.');E.tiers.paid[i][f]=t.value;save()}
}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,E=cur();
 if(a==='sel'){sel=b.dataset.id;tab='dossier'}
 else if(a==='tab')tab=b.dataset.id;
 else if(a==='add'){const n=mk('New endeavour');D.e.push(n);sel=n.id;tab='dossier'}
 else if(a==='del'){if(!confirm('Delete "'+(E.name||'Untitled')+'" and everything recorded for it?'))return;D.e=D.e.filter(x=>x.id!==E.id);if(!D.e.length)D.e.push(mk('New endeavour'));sel=D.e[0].id}
 else if(a==='chip'){if(noFree(E))E.tiers.free=CH[b.dataset.i]+': '}
 else if(a==='addtier')E.tiers.paid.push({name:'',price:'',inc:''});
 else if(a==='deltier')E.tiers.paid.splice(b.dataset.i,1);
 else if(a==='export'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));l.download='the-process-'+new Date().toISOString().slice(0,10)+'.json';l.click();return}
 else if(a==='import'){document.getElementById('file').click();return}
 else if(a==='sendmc'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(sum(),null,1)],{type:'application/json'}));l.download='process-summary-'+new Date().toISOString().slice(0,10)+'.json';l.click();return}
 else if(a==='email'){emailView();return}
 save();render();
});
const msg=t=>{const m=document.getElementById('msg');if(m)m.textContent=t};
function mergeMC(p){
 let E=D.e.find(x=>x.name===p.name);if(!E){E=mk(p.name);D.e.push(E)}
 const fill=(path,v)=>{v=(v==null?'':String(v)).trim();if(v&&!String(get(E,path)||'').trim())set(E,path,v)};
 fill('offering.what',p.offering);fill('offering.who',p.target);
 const sf=p.structure||{};fill('structure.type',sf.bs);fill('funnel.overview',sf.fn);
 fill('files',(p.locations||[]).map(r=>[r.loc,r.link,r.what].filter(x=>x&&String(x).trim()).join(' - ')).filter(Boolean).join('\n'));
 PH.forEach(([k])=>{const c=(p.workflow||{})[k];if(!c)return;
  if(!Number(get(E,'phases.'+k+'.s'))&&Number(c.s))set(E,'phases.'+k+'.s',Number(c.s));
  fill('phases.'+k+'.steps',(c.steps||[]).map(x=>x.t).join('\n'));
  fill('phases.'+k+'.objs',(c.objs||[]).map(o=>{const a=(c.acts||[]).filter(x=>x.o===o.id).map(x=>'  ['+(x.d?'x':' ')+'] '+x.t).join('\n');return o.t+(a?'\n'+a:'')}).join('\n'))});
}
function importFile(txt){
 const j=JSON.parse(txt);
 if(Array.isArray(j.e)&&!j.v){if(!confirm('Replace everything here with this backup?'))return;D=j;msg('Backup restored.');return}
 const list=j.from==='mission-control'?j.e:(Array.isArray(j)?j:j.items);
 if(!Array.isArray(list))throw new Error('shape');
 let n=0,u=0;list.forEach(p=>{if(p&&p.name){D.e.some(x=>x.name===p.name)?u++:n++;mergeMC(p)}});
 msg(n+' added, '+u+' updated. Existing text was kept; only blank fields were filled.');
}
document.getElementById('file').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{importFile(r.result);sel=null;save();render()}catch(x){msg('That file could not be read. Choose a backup from The Process or a summary or export from Mission Control.')}};
 r.readAsText(f);e.target.value='';
});
load();save();render();
</script>
</body>
</html>
